name: R-CMD-check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'release' }
          - { os: macos-latest, r: 'release' }
          - { os: windows-latest, r: 'release' }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-build-vignettes")'
      - name: Check archived research workflows against the installed package
        shell: Rscript {0}
        run: |
          candidate_lib <- tempfile("ftq-archive-library-")
          dir.create(candidate_lib)
          install.packages(".", lib = candidate_lib, repos = NULL, type = "source")
          .libPaths(c(candidate_lib, .libPaths()))
          stopifnot(nzchar(find.package("FibrTraQ", lib.loc = candidate_lib)))
          Sys.setenv(NOT_CRAN = "true")
          source("archive/tests/run.R")
