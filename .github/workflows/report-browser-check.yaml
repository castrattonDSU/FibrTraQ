name: Windows report browser check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-browser-check:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tractogram-format: [trk, tck]
    steps:
      - uses: actions/checkout@v6
      - name: Set the report output directory on the runner
        shell: pwsh
        run: |
          $reviewPath = Join-Path $env:RUNNER_TEMP "ftq-browser-${{ matrix.tractogram-format }}"
          "QA_ROOT=$reviewPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          needs: check
      - name: Build and install the candidate
        shell: Rscript {0}
        run: |
          source <- normalizePath(Sys.getenv("GITHUB_WORKSPACE"), winslash = "/")
          build <- file.path(Sys.getenv("RUNNER_TEMP"), "fibrtraq-browser-build")
          library <- file.path(build, "library")
          dir.create(library, recursive = TRUE)
          setwd(build)
          status <- system2(file.path(R.home("bin"), "R"),
                            c("CMD", "build", "--no-build-vignettes", shQuote(source)))
          stopifnot(status == 0L)
          archive <- list.files(build, "^FibrTraQ_.*[.]tar[.]gz$", full.names = TRUE)
          stopifnot(length(archive) == 1L)
          install.packages(archive, repos = NULL, type = "source", lib = library)
          installed <- packageDescription("FibrTraQ", lib.loc = library)
          stopifnot(identical(installed$Version, unname(read.dcf(file.path(source, "DESCRIPTION"))[1L, "Version"])))
          cat(paste0("FIBRTRAQ_QA_LIBRARY=", normalizePath(library, winslash = "/"), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
      - name: Generate and relocate the installed-package ${{ matrix.tractogram-format }} example
        shell: Rscript {0}
        run: |
          script <- file.path(Sys.getenv("GITHUB_WORKSPACE"), ".github", "scripts", "browser-acceptance", "generate-fixture.R")
          libraries <- c(Sys.getenv("FIBRTRAQ_QA_LIBRARY"), Sys.getenv("R_LIBS_USER"))
          stopifnot(nzchar(libraries[[1L]]), dir.exists(libraries[[1L]]))
          Sys.setenv(R_LIBS_USER = paste(libraries[nzchar(libraries)], collapse = .Platform$path.sep))
          status <- system2(file.path(R.home("bin"), "Rscript"),
                            c("--vanilla", shQuote(script), shQuote(Sys.getenv("QA_ROOT")),
                              "${{ matrix.tractogram-format }}"))
          stopifnot(status == 0L)
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the pinned browser test tools
        working-directory: .github/scripts/browser-acceptance
        run: npm ci --ignore-scripts
      - name: Install the matching Chromium binary
        working-directory: .github/scripts/browser-acceptance
        run: npx playwright install chromium
      - name: Exercise reports in native Windows Chromium
        working-directory: .github/scripts/browser-acceptance
        run: node report-browser-check.cjs "$env:QA_ROOT/browser-fixture.json"
      - name: Retain synthetic reports and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-report-browser-${{ matrix.tractogram-format }}-${{ github.sha }}
          path: ${{ env.QA_ROOT }}
          retention-days: 14
          if-no-files-found: warn
