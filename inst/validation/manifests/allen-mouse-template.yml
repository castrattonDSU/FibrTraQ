#   validated_anatomy: derivatives/rois/sub-mouse_space-ccf_desc-brain_mask.nii.gz

coordinate:
  track_space: auto
  discretization: any
  axis_flip: auto

analysis:
  endpoint_analysis: exact_and_dilated1

outputs:
  derivative_name: fibrtraq-validation
  write_maps: true
  write_report: true
  overwrite: false

report:
  background_image: derivatives/anat/sub-mouse001_space-ccf_reference.nii.gz

