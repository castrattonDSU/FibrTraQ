dataset_root: /path/to/mouse-dmri-ccf
subject: sub-mouse001
description: allen-ccf-validation

tractogram: derivatives/tractography/sub-mouse001_space-ccf_desc-wholebrain_tractogram.trk
fnode: derivatives/rois/sub-mouse001_label-fnode_space-ccf_mask.nii.gz
local:

targets:
  ccf_target_a: derivatives/rois/sub-mouse001_label-targetA_space-ccf_mask.nii.gz
  ccf_target_b: derivatives/rois/sub-mouse001_label-targetB_space-ccf_mask.nii.gz

